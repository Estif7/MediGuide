<div class="page">
  <mat-card appearance="outlined" class="hero-card">
    <mat-card-content>
      <div class="hero-title-row">
        <div>
          <p>Welcome Agent, {{ user()?.fullName }}</p>
        </div>
      </div>
    </mat-card-content>
  </mat-card>

  <div class="summary-grid">
    <mat-card appearance="outlined">
      <mat-card-title>Open bookings</mat-card-title>
      <mat-card-content>
        <strong>{{ bookings().length }}</strong>
      </mat-card-content>
    </mat-card>
  </div>

  <mat-card appearance="outlined" class="list-card">
    <mat-card-header>
      <mat-card-title>Bookings</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <app-state-panel
        [loading]="bookingsLoading()"
        [error]="bookingsError()"
        [empty]="bookings().length === 0"
        emptyMessage="No bookings yet."
        emptyIcon="event_busy"
        [retry]="loadBookings.bind(this)"
      >
        <mat-list>
          @for (b of bookings(); track b.id) {
            <a class="list-item-link" [routerLink]="['/agent/bookings', b.id]">
              <mat-list-item>
                <span matListItemTitle>{{ b.categoryName }} · {{ b.patientName }}</span>
                <span matListItemLine>{{ statusLabel(b.status) }} @if (b.agentName) { · Agent: {{ b.agentName }} }</span>
              </mat-list-item>
            </a>
          }
        </mat-list>
      </app-state-panel>
    </mat-card-content>
  </mat-card>
</div>
